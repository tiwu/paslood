[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paslood"
version = "0.8.0"
description = "Paslood — Whole-Life Balance Sheet, PDT Strategic Companion & Belgian Fiscal Shield"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Paslood Contributors" }
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "httpcore>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "playwright>=1.45.0",
    "pytest-playwright>=0.5.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
paslood = "paslood.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paslood"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "--ignore=tests/e2e"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (standard for Typer and FastAPI)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "playwright>=1.45.0",
    "pytest-playwright>=0.5.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mkdocs-material>=9.5.0",
]

