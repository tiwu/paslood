site_name: Paslood (Wealth Pilot) Documentation
site_description: Whole-Life Balance Sheet, PDT Strategic Companion & Belgian Fiscal Shield
site_author: Paslood Contributors
site_url: https://tiwu.github.io/paslood/

repo_name: paslood
repo_url: https://github.com/tiwu/paslood

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Self-Hosting & Deployment: self-hosting.md
  - Core Concepts:
      - Strategic Buckets: concepts/buckets.md
      - Balance Sheet & Net Worth: concepts/balance-sheet.md
      - Buy-Only Rebalancing: concepts/rebalancing.md
  - Data Ingestion:
      - KBC Bank Statements: ingestion/kbc-csv.md
      - PDT MCP Integration: ingestion/pdt-mcp.md
      - Generic CSV / Excel: ingestion/generic-csv.md
      - Manual Accounts & Bunq: ingestion/manual-accounts.md
  - Guidance Engine:
      - Debt Payoff Strategy: guidance/debt-payoff.md
      - Net Worth Projections: guidance/net-worth-projections.md
      - Belgian Tax Optimization: guidance/tax-optimization.md
  - AI Advisor:
      - Setup & API Keys: ai-advisor/setup.md
  - Architecture Plans:
      - Overview & Standards: plans/README.md
      - Plan Template: plans/PLAN-TEMPLATE.md
      - "Issue #3 - Exclude Bucket from Rebalancing": plans/PLAN-3-option-to-exclude-bucket-from-weight-cal.md
      - "Issue #7 - Dutch (NL) Translation and Localization": plans/PLAN-7-add-translation-to-nl.md
      - "Issue #15 - Workflow Job Summaries": plans/PLAN-15-job-summaries.md
  - Architecture & UX Reviews:
      - Architecture Review: reviews/ARCHITECTURE-REVIEW.md
      - UI/UX Review: reviews/UX-REVIEW.md


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
