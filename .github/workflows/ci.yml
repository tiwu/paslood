name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        id: linter
        run: uv run ruff check src tests scripts

      - name: Run Ruff Formatter Check
        id: formatter
        run: uv run ruff format --check src tests scripts

      - name: Verify Documentation Build
        id: docs
        run: uv run mkdocs build --strict

      - name: Generate Lint & Formatting Summary
        if: always()
        run: |
          uv run python scripts/ci_summary.py lint \
            --linter "${{ steps.linter.outcome }}" \
            --formatter "${{ steps.formatter.outcome }}" \
            --docs "${{ steps.docs.outcome }}" \
            --python "3.11" \
            --runner "${{ runner.os }} (${{ runner.arch }})" \
            --run-id "${{ github.run_id }}"

  test:
    name: Test Suite & Coverage (Python 3.11)
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright Chromium Browser
        run: uv run playwright install --with-deps chromium

      - name: Build Documentation Site
        run: uv run mkdocs build

      - name: Run Unit, Integration & Delivery Test Suite with Coverage
        id: test
        run: uv run pytest tests/unit tests/integration tests/delivery -v --cov=src/wealth_pilot --cov-fail-under=90 --cov-report=term-missing --cov-report=xml

      - name: Run Frontend JS & Playwright E2E UI Workflows
        id: ui_test
        run: uv run pytest tests/delivery/test_frontend_integrity.py tests/e2e/test_ui_workflows.py -v

      - name: Generate Test & Coverage Summary
        if: always()
        run: |
          uv run python scripts/ci_summary.py test \
            --status "${{ steps.test.outcome }}" \
            --ui-status "${{ steps.ui_test.outcome }}" \
            --run-id "${{ github.run_id }}"



