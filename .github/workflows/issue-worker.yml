name: Autonomous Issue Worker

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Target specific issue number (optional)"
        required: false
        type: string
  schedule:
    - cron: "0 * * * *"  # Run hourly

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-issue:
    name: Process Issue Lifecycle
    runs-on: ubuntu-24.04
    if: |
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'agent:plan') ||
      contains(github.event.issue.labels.*.name, 'agent:approved')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Autonomous Issue Poller
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          ARGS=("--repo" "$REPO_NAME")
          if [ -n "$INPUT_ISSUE" ]; then
            ARGS+=("--issue" "$INPUT_ISSUE")
          elif [ "$EVENT_NAME" = "issues" ] && [ -n "$ISSUE_NUMBER" ]; then
            ARGS+=("--issue" "$ISSUE_NUMBER")
          fi
          echo "Executing poll_issues with args: ${ARGS[*]}"
          uv run python scripts/poll_issues.py "${ARGS[@]}"
