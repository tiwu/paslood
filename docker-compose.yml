services:
  paslood:
    build:
      context: .
      dockerfile: Dockerfile
    image: paslood:latest
    container_name: paslood
    restart: unless-stopped
    environment:
      - PASLOOD_MODE=${PASLOOD_MODE:-self_host}
      - PASLOOD_DATA_DIR=/data
      - PASLOOD_SECRET_KEY=${PASLOOD_SECRET_KEY:-}
      - PASLOOD_AUTH_MODE=${PASLOOD_AUTH_MODE:-both}
      - PASLOOD_ALLOWED_EMAILS=${PASLOOD_ALLOWED_EMAILS:-}
      - PASLOOD_TRUSTED_ORIGINS=${PASLOOD_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - PASLOOD_GOOGLE_CLIENT_ID=${PASLOOD_GOOGLE_CLIENT_ID:-}
      - PASLOOD_GOOGLE_CLIENT_SECRET=${PASLOOD_GOOGLE_CLIENT_SECRET:-}
      - PASLOOD_GITHUB_CLIENT_ID=${PASLOOD_GITHUB_CLIENT_ID:-}
      - PASLOOD_GITHUB_CLIENT_SECRET=${PASLOOD_GITHUB_CLIENT_SECRET:-}
      - PASLOOD_META_CLIENT_ID=${PASLOOD_META_CLIENT_ID:-}
      - PASLOOD_META_CLIENT_SECRET=${PASLOOD_META_CLIENT_SECRET:-}
    volumes:
      - paslood_data:/data
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Profile: tailscale
  # Enables secure private WireGuard mesh access from mobile phone / laptop without exposing open ports
  # Usage: docker compose --profile tailscale up -d
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["tailscale"]
    container_name: paslood-tailscale
    hostname: paslood
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    network_mode: "service:paslood"
    restart: unless-stopped
    depends_on:
      - paslood

  # Profile: cloudflared
  # Enables zero-trust remote access through Cloudflare Tunnel
  # Usage: docker compose --profile cloudflared up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflared"]
    container_name: paslood-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - paslood

  # Profile: ddns
  # Automatic TLS reverse proxy via Caddy for DuckDNS or custom domain
  # Usage: docker compose --profile ddns up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["ddns"]
    container_name: paslood-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - paslood

volumes:
  paslood_data:
  tailscale_data:
  caddy_data:
  caddy_config:
